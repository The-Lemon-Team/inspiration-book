<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Warm Minimalism Background */
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

            backdrop-filter: blur(8px);

        }
        .phone-frame {
            width: 393px;
            height: 852px;
            border: 12px solid #111827;
            border-radius: 54px;
            position: relative;

        }
        .dynamic-island {

<body class="flex items-center justify-center min-h-screen p-4">
<!-- iPhone 14 Pro Frame -->
<div class="phone-frame bg-surface-container-low hidden md:block">
<div class="dynamic-island"></div>
<!-- App Content Inside Frame -->
<div class="h-full w-full overflow-y-auto flex flex-col pt-16 px-6">
<header class="mb-12 text-center">
<h1 class="font-headline-h1 text-headline-h1-mobile lowercase text-primary mb-2">inspiration book</h1>
<p class="font-body-md text-on-surface-variant opacity-60">твой личный цифровой дневник</p>
</header>
<main class="flex-1 flex flex-col justify-center">
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-8 shadow-sm">
<h2 class="font-headline-h2 text-headline-h2 mb-6 text-on-surface">Вход</h2>
<form class="space-y-4" onsubmit="event.preventDefault();">
<div class="space-y-1">
<label class="font-label-caps text-label-caps text-on-surface-variant ml-1">Электронная почта</label>
<input class="w-full px-4 py-3 bg-surface border border-outline-variant rounded-lg focus:outline-none focus:ring-1 focus:ring-primary transition-all font-body-md" placeholder="mail@example.com" type="email"/>
</div>
<div class="space-y-1">
<label class="font-label-caps text-label-caps text-on-surface-variant ml-1">Пароль</label>
<div class="relative">
<input class="w-full px-4 py-3 bg-surface border border-outline-variant rounded-lg focus:outline-none focus:ring-1 focus:ring-primary transition-all font-body-md" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<div class="pt-4">
<button class="w-full bg-[#111827] text-white py-3.5 rounded-xl font-medium hover:opacity-90 active:scale-[0.98] transition-all font-body-md">
                                Войти
                            </button>
</div>
</form>
<div class="mt-8 text-center">
<a class="text-caption font-caption text-secondary hover:underline" href="#">
                            Нет аккаунта? Зарегистрироваться
                        </a>
</div>
</div>
<!-- Subtle Decorative Element (Warm Minimalism) -->
<div class="mt-12 opacity-30 flex justify-center">
<div class="w-24 h-1 bg-outline-variant rounded-full"></div>
</div>
</main>
</div>
</div>
<!-- Mobile View (Displayed on small screens without frame) -->
<div class="md:hidden w-full max-w-[400px] flex flex-col">
<header class="mb-10 text-center">
<h1 class="font-headline-h1 text-headline-h1-mobile lowercase text-primary mb-2">inspiration book</h1>
</header>
<div class="bg-white border border-[#e5e7eb] rounded-2xl p-8 shadow-sm">
<h2 class="font-headline-h2 text-headline-h2 mb-6 text-[#1f2937]">Вход</h2>
<form class="space-y-4" onsubmit="event.preventDefault();">
<div class="space-y-1">
<label class="text-[12px] font-semibold text-gray-500 uppercase tracking-wider ml-1">Электронная почта</label>
<input class="w-full px-4 py-3 bg-white border border-[#d1d5db] rounded-xl focus:outline-none focus:border-[#111827] transition-colors" placeholder="mail@example.com" type="email"/>
</div>
<div class="space-y-1">
<label class="text-[12px] font-semibold text-gray-500 uppercase tracking-wider ml-1">Пароль</label>
<input class="w-full px-4 py-3 bg-white border border-[#d1d5db] rounded-xl focus:outline-none focus:border-[#111827] transition-colors" placeholder="••••••••" type="password"/>
</div>
<div class="pt-4">
<button class="w-full bg-[#111827] text-white py-4 rounded-xl font-semibold hover:bg-black transition-colors shadow-lg shadow-gray-200">
                        Войти
                    </button>
</div>
</form>
<div class="mt-8 text-center">
<a class="text-[14px] text-blue-600 font-medium hover:underline" href="#">
                    Нет аккаунта? Зарегистрироваться
                </a>
</div>
</div>
</div>
<!-- Decorative Animated Background (Soft Atmosphere) -->
<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">

</div>
<script>
        // Micro-interactions for inputs
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('label').style.color = '#111827';
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('label').style.color = '';
            });
        });

        // Simple visibility toggle logic
        const toggleBtn = document.querySelector('button .material-symbols-outlined[data-icon="visibility"]');
        if(toggleBtn) {
            toggleBtn.parentElement.addEventListener('click', function() {
                const input = this.parentElement.querySelector('input');
                if (input.type === 'password') {
                    input.type = 'text';
                    this.querySelector('span').textContent = 'visibility_off';
                } else {
                    input.type = 'password';
                    this.querySelector('span').textContent = 'visibility';
                }
            });
        }
    </script>
